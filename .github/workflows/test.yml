
name: Test Project

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

  docker-flask:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Flask image
        run: docker build -t hamed13579169/my-flask-app:${{ github.ref_name }} ./flask-app

      - name: Push Flask image
        run: docker push hamed13579169/my-flask-app:${{ github.ref_name }}


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Build project
        run: echo "Building project..."

      - name: Create build file
        run: echo "Build completed successfully" > build.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build.txt

      - name: Build result
        run: echo "Build successful!"

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t hamed13579169/my-python-app:latest .

      - name: Push Docker image
        run: docker push hamed13579169/my-python-app:latest

      - name: Push Docker image
        run: docker push hamed13579169/my-python-app:latest
